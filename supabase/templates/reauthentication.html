<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Token }} is your Meal Planner verification code</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f7f9fc; color: #111827;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: transparent;">Use this code to confirm it’s you.</div>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; background: #f7f9fc;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="width: 100%; max-width: 600px; overflow: hidden; border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff;">
            <tr>
              <td style="padding: 20px 32px; border-bottom: 1px solid #e5e7eb;">
                <a href="{{ .SiteURL }}" style="display: inline-block; color: #111827; font-family: Inter, Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; text-decoration: none;">Meal Planner</a>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">
                <p style="margin: 0 0 8px; color: #636b2f; font-family: Inter, Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; line-height: 1.4;">Account security</p>
                <h1 style="margin: 0 0 16px; color: #111827; font-family: Inter, Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2;">Confirm it’s you</h1>
                <p style="margin: 0 0 16px; color: #4b5563; font-family: Inter, Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5;">
                  Enter this verification code in Meal Planner to continue. It expires shortly.
                </p>
                <div style="margin: 24px 0; padding: 18px; border: 1px solid #d1d5db; border-radius: 8px; background: #f7f9fc; color: #111827; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 0.18em; line-height: 1.2; text-align: center;">{{ .Token }}</div>
                <p style="margin: 24px 0 0; padding-top: 24px; border-top: 1px solid #e5e7eb; color: #6b7280; font-family: Inter, Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.5;">Never share this code. Meal Planner will never ask for it by email or phone.</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px; border-top: 1px solid #e5e7eb; background: #f7f9fc; color: #6b7280; font-family: Inter, Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.5;">
                Plan meals, save recipes, and shop together.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
